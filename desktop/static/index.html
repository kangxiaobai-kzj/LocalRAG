<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>LocalRAG · 正在启动</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 800px at 20% 10%, #1b2a4a 0%, #0d1526 55%, #0a1020 100%);
      color: #e8eefc;
    }
    .box { text-align: center; }
    .logo {
      width: 84px; height: 84px; margin: 0 auto 22px;
      border-radius: 22px;
      background: linear-gradient(135deg, #2f6bff 0%, #17c3b2 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 700; color: #fff;
      box-shadow: 0 10px 34px rgba(47, 107, 255, .35);
    }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: 1px; }
    .sub { margin-top: 10px; font-size: 13px; color: #93a6c8; }
    .spinner {
      width: 34px; height: 34px; margin: 30px auto 0;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: #2f6bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">LR</div>
    <h1>LocalRAG</h1>
    <div class="sub">正在启动本地智能体服务，请稍候…</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
